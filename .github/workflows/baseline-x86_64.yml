name: Baseline x86_64 (no AVX2)

# 给没有 AVX2 的老 CPU 复刻 rtk（例：i5-3337U Ivy Bridge，有 AVX 无 AVX2）。
#
# 背景：上游 v1.2.x 的官方 release 用 target-cpu=native 编译，产物含
# vpermd / vpcmpeqb / %ymm 等 AVX2 指令，在 Ivy Bridge 上直接 SIGILL
# （非法指令，core dump，exit 132）。这里固定用 -C target-cpu=x86-64 基线编译，
# 保证产物只含 x86-64 基线指令集，老 CPU 也能跑。

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/baseline-x86_64.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-musl:
    name: x86_64-unknown-linux-musl (baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build (target-cpu=x86-64)
        run: cargo build --release --target x86_64-unknown-linux-musl
        env:
          RUSTFLAGS: "-C target-cpu=x86-64"

      - name: Verify no AVX/AVX2 instructions in binary
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/rtk
          echo "== instruction scan =="
          for pat in '%ymm' 'vpermd' 'vpcmpeqb' '%zmm'; do
            n=$(objdump -d "$BIN" | grep -c -- "$pat" || true)
            echo "$pat: $n"
          done
          echo "== version =="
          "$BIN" --version
          file "$BIN"

      - name: Package
        run: |
          tar -czvf rtk-x86_64-unknown-linux-musl-baseline.tar.gz \
            -C target/x86_64-unknown-linux-musl/release rtk
          sha256sum rtk-x86_64-unknown-linux-musl-baseline.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-baseline-x86_64-musl
          path: rtk-x86_64-unknown-linux-musl-baseline.tar.gz
          if-no-files-found: error
